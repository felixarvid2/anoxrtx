[rtxconf.default]
; Remix variables applied with the Remix API on every map load (needs remixapi = 1 in QindieGL.ini and
; exposeRemixApi = True in .trex/bridge.conf). A map section can only change keys listed here, and the value
; here is what other maps get back, so put each key here with its normal value from rtx.conf. Examples:
; rtx.autoExposure.evMinValue = -2
; Exposure matched to the original game (tools/anoxcheck.py --ab-original, original shots corrected for the game's
; u_gl_gamma 1.4; docs/exposure-match.md): Remix was ~2.3 EV brighter (median of 7 maps). -2.0 for unmeasured maps,
; the measured value per map below. Raise towards 0 for a brighter look.
rtx.tonemap.exposureBias = -2.0
; autoexposure on everywhere except maps whose indoor/outdoor contrast it flattens (starport); with it off,
; exposureBias is the fixed exposure
rtx.autoExposure.enabled = True

; Remix Plus (RemixProjGroup/dxvk-remix) only: the Numos physical sky (clouds, sun, time of day) on the
; outdoor maps that have an ArghRad sun. Everywhere else it would replace space and city skies, so it is off by
; default. Sun elevation/rotation come from each map's sun (bsp2lights.py); rotation 0 = towards +X (the
; Numos convention is not documented, so shadows may need turning). On the stock Remix runtime these keys do
; not exist and are only logged as failed.
rtx.skyMode = 0
rtx.atmosphere.sunElevation = 15
rtx.atmosphere.sunRotation = 0
; the game's fog as volumetric fog (also set in rtx.conf); e.g. [rtxconf.rowdys] rtx.volumetrics.enableFogRemap = False
rtx.volumetrics.enableFogRemap = True
rtx.volumetrics.enableFogColorRemap = True
; skybox brightness: on sunlit outdoor maps autoexposure adapts to the bright ground and the skybox (fixed
; radiance) ends up several EV darker than in the original; raise it per map
rtx.skyBrightness = 1
; additive (SRC_ALPHA, ONE) draws as emitters of this intensity; Remix otherwise draws them faint. Off by default:
; it changes every additive effect. On for maps whose look depends on one (bricksd: the energy column in the shaft;
; func_fog glow: pay2pray, vendomart, onegate, temple, fortressgrounds, hephfactory, fortress2 8, hive 20; commbase: the sentinel
; beams). Untextured draws (beams, func_fog) need QindieGL >= #35 (#34 plus the colour-cache fix).
rtx.enableEmissiveBlendEmissiveOverride = False
rtx.emissiveBlendOverrideEmissiveIntensity = 1
; textures without a replacement material, among them the characters (their skins are composed at runtime, so
; their hashes change). Remix gives them a 0.04 dielectric specular lobe that the original's diffuse-only model
; shading lacks. Higher metallic + roughness 1 (F0 = mix(0.04, albedo, metallic)) darkens characters: metallic
; 0.5 by ~0.4-0.9 EV, metallic 1 by ~1-1.5 EV (too dark). Set to 0.5 only on maps where characters stayed too
; bright at model_fill 0.1; elsewhere they would end up too dark. Also affects world textures without a pbr block
; on those maps (slightly glossier). docs/exposure-match.md
rtx.legacyMaterial.metallicConstant = 0.1
rtx.legacyMaterial.roughnessConstant = 0.7

; no Numos sky (as starport): it replaced the city skyline in the skybox (docs/exposure-match.md)
[rtxconf.sunstrip]
rtx.tonemap.exposureBias = -2.4

[rtxconf.starport]
; no Numos sky: it replaced the city skyline (blue spires, pink towers) in the skybox, and its sun backlit the
; background buildings into black silhouettes (docs/exposure-match.md)
; fixed exposure: autoexposure brought the outdoor walkway to the indoor brightness, while the original is ~4x
; brighter outdoors (walkway +3.2/+2.6 EV too dark). Off + bias 0: start +0.19, walkway +0.45/+0.52, atrium -0.39
rtx.autoExposure.enabled = False
rtx.tonemap.exposureBias = 0

; no Numos sky: the original's sunny desert skybox. Its blue fog tinted the sunlit terrain blue (fog colour off),
; and the skybox needs to be brighter against the sunlit ground
[rtxconf.comhills]
rtx.tonemap.exposureBias = -0.4
rtx.volumetrics.enableFogColorRemap = False
rtx.skyBrightness = 24

