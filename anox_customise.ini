; QindieGL per-map settings for Anachronox. Copy next to anox.exe.
; QindieGL rereads this file when a map loads, and when it (or the map's .lights file) is saved while playing.
; Sections ending in .global apply to every map; .<map> (e.g. maplights.rowdys) overrides them for one map.
; Map names are the .bsp names in lower case without the extension (the log prints "MapLights: map '...'").

[maplights.global]
; Map light formula for `format raw` .lights files (tools/bsp2lights.py):
;   intensity = scale * ref * (light / ref) ^ exponent      radius = radius
; exponent 2 = light^2/300 (the calibrated default), 1 = linear (brighter for lights below ref)
scale = 1
exponent = 2
ref = 300
; character fill light (QindieGL #30, #32): a small spot light on each character near the camera, as bright as
; model_fill times the map lights' irradiance at the character (no occlusion, no Numos sky), coloured like the
; original's model light. 1.5 matches the original on most measured maps; maps where the room already lights
; the characters (outdoor, occluded) set their own value below. 0 = off
model_fill = 1.5
radius = 4
; extra factor for the worldspawn sun (ArghRad _sun_light / 200)
sun_scale = 1
; dynamic lights (muzzle flashes, explosions, spells; QindieGL.ini dlights = 1) use the same formula with
; their intensity (reach in game units) as the light value; 0 turns them off
dlight_scale = 1
dlight_radius = 4
; light styles from the game (flicker in sync, switchable lights on/off; needs .lights from bsp2lights.py
; --events and QindieGL #27+); 0 = QindieGL's own timers for styles 1..11, START_OFF lights stay off
event_lights = 1

; Example: a map that is too dark
; [maplights.rowdys]
; scale = 1.5

; Numos (see [rtxconf.*] below) brings its own sun on these maps
[maplights.sunstrip]
sun_scale = 0
[maplights.starport]
model_fill = 0.3
sun_scale = 0
[maplights.comhills]
sun_scale = 0
[maplights.baltown]
model_fill = 0
sun_scale = 0
[maplights.baltownr]
sun_scale = 0

[maplights.greattree]
model_fill = 0.1

[maplights.bricksb]
model_fill = 0.35

[maplights.rowdys]
model_fill = 0.9

[maplights.labbuilding]
model_fill = 0.6

[rtxconf.default]
; Remix variables applied with the Remix API on every map load (needs remixapi = 1 in QindieGL.ini and
; exposeRemixApi = True in .trex/bridge.conf). A map section can only change keys listed here, and the value
; here is what other maps get back, so put each key here with its normal value from rtx.conf. Examples:
; rtx.autoExposure.evMinValue = -2
; Exposure matched to the original game (tools/anoxcheck.py --ab-original, original shots corrected for the game's
; u_gl_gamma 1.4; docs/exposure-match.md): Remix was ~2.3 EV brighter (median of 7 maps). -2.0 for unmeasured maps,
; the measured value per map below. Raise towards 0 for a brighter look.
rtx.tonemap.exposureBias = -2.0

; Remix Plus (RemixProjGroup/dxvk-remix) only: the Numos physical sky (clouds, sun, time of day) on the
; outdoor maps that have an ArghRad sun. Everywhere else it would replace space and city skies, so it is off by
; default. Sun elevation/rotation come from each map's sun (bsp2lights.py); rotation 0 = towards +X (the
; Numos convention is not documented, so shadows may need turning). On the stock Remix runtime these keys do
; not exist and are only logged as failed.
rtx.skyMode = 0
rtx.atmosphere.sunElevation = 15
rtx.atmosphere.sunRotation = 0
; the game's fog as volumetric fog (also set in rtx.conf); e.g. [rtxconf.rowdys] rtx.volumetrics.enableFogRemap = False
rtx.volumetrics.enableFogRemap = True
rtx.volumetrics.enableFogColorRemap = True
; skybox brightness: on sunlit outdoor maps autoexposure adapts to the bright ground and the skybox (fixed
; radiance) ends up several EV darker than in the original; raise it per map
rtx.skyBrightness = 1

[rtxconf.sunstrip]
rtx.tonemap.exposureBias = -4.3
rtx.skyMode = 1
rtx.atmosphere.sunElevation = 40
rtx.atmosphere.sunRotation = 204

[rtxconf.starport]
rtx.tonemap.exposureBias = -2.5
rtx.skyMode = 1
rtx.atmosphere.sunElevation = 40
rtx.atmosphere.sunRotation = 200

[rtxconf.comhills]
rtx.tonemap.exposureBias = -2.4
rtx.skyMode = 1
rtx.atmosphere.sunElevation = 40
rtx.atmosphere.sunRotation = 120

; baltown is a night map (weak blue sun light): sun below the horizon
[rtxconf.baltown]
rtx.tonemap.exposureBias = -0.5
rtx.skyMode = 1
rtx.atmosphere.sunElevation = -8
rtx.atmosphere.sunRotation = 204

