; QindieGL per-map settings for Anachronox. Copy next to anox.exe.
; QindieGL rereads this file when a map loads, and when it (or the map's .lights file) is saved while playing.
; Sections ending in .global apply to every map; .<map> (e.g. maplights.rowdys) overrides them for one map.
; Map names are the .bsp names in lower case without the extension (the log prints "MapLights: map '...'").

[maplights.global]
; Map light formula for `format raw` .lights files (tools/bsp2lights.py):
;   intensity = scale * ref * (light / ref) ^ exponent      radius = radius
; exponent 2 = light^2/300 (the calibrated default), 1 = linear (brighter for lights below ref)
scale = 1
exponent = 2
ref = 300
; character fill light (QindieGL #30, #32): a small spot light on each character near the camera, as bright as
; model_fill times the map lights' irradiance at the character (no occlusion, no Numos sky), coloured like the
; original's model light. 1.5 matches the original on most measured maps; maps where the room already lights
; the characters (outdoor, occluded) set their own value below. 0 = off
model_fill = 1.5
radius = 4
; extra factor for the worldspawn sun (ArghRad _sun_light / 200). Remix spreads a distant light's radiance over
; its 2 degree disc, so 1 barely lit anything; 12 lights comhills' terrain like the original (2026-10-26)
sun_scale = 12
; dynamic lights (muzzle flashes, explosions, spells; QindieGL.ini dlights = 1) use the same formula with
; their intensity (reach in game units) as the light value; 0 turns them off
dlight_scale = 1
dlight_radius = 4
; light styles from the game (flicker in sync, switchable lights on/off; needs .lights from bsp2lights.py
; --events and QindieGL #27+); 0 = QindieGL's own timers for styles 1..11, START_OFF lights stay off
event_lights = 1

